name: Deploy repository to Github Pages

on:
  push:
      paths:
      - 'plugins/**'
      branches:
      - main
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: '0'
    # a plugin file Stash can't read would break the plugin for everyone who
    # updates: stop here instead of publishing it
    - name: Check every plugin's YAML
      run: |
        pip install --quiet pyyaml
        python3 - <<'EOF'
        import glob, sys, yaml
        bad = 0
        for f in sorted(glob.glob("plugins/**/*.yml", recursive=True)):
            try:
                d = yaml.safe_load(open(f, encoding="utf-8"))
                if not isinstance(d, dict) or not d.get("name"):
                    raise ValueError("no name: at the top level")
                print("ok  ", f)
            except Exception as e:
                bad += 1
                print(f"::error file={f}::{e}")
        sys.exit(1 if bad else 0)
        EOF
    - run: |
        chmod +x build_site.sh
        ./build_site.sh _site/${{ github.ref_name }}
    - uses: actions/upload-pages-artifact@v5

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}main/index.yml
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
