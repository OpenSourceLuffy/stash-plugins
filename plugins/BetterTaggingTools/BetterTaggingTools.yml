name: Better Tagging Tools
description: Tags each performer and studio with the tags used most often in their scenes, images and galleries, and each gallery with its images' most used tags, shows one-click "Suggested tags" when editing tags (tags that usually go with the ones already chosen, and the performers' top tags), and adds "Bulk tag" buttons on performer pages (a performer's scenes, images and galleries) and gallery pages (a gallery's images). Can also tag every image in a gallery with the gallery's name, give tags without a picture one from your library, keep tag names consistently capitalised, auto tag from file names (new performers, studios and tags, or one item at a time), fill in dates and titles from file names, suggest title ideas while editing (from performers, tags and the local AI), and tag scenes and images with a local AI model (Ollama).
version: "1.4"
url: https://github.com/OpenSourceLuffy/stash-plugins/tree/main/plugins/BetterTaggingTools
exec:
  - python
  - "{pluginDir}/better_tagging_tools.py"
interface: raw

ui:
  javascript:
    - better-tagging-tools.js
  css:
    - better-tagging-tools.css

hooks:
  - name: Refresh performer top tags on edit
    description: When tags or performers change on a scene, image or gallery, queues that item's performers (and, if turned on, its studio and galleries). A background job refreshes each of them once, a few seconds after the last edit, so batch edits are handled in one go.
    triggeredBy:
      - Scene.Update.Post
      - Image.Update.Post
      - Gallery.Update.Post
  - name: New galleries, scenes and images
    description: When "Tag gallery images with the gallery's name" is on, new galleries and newly scanned images get their gallery-name tag; when "AI-tag new scenes and images" is on, new scenes and images are AI-tagged; when "Fill in dates of new scenes, images and galleries" or "Fill in titles of new scenes, images and galleries" is on, they get the date or title from their file name. They're queued and a background job does the work once the scan is done.
    triggeredBy:
      - Gallery.Create.Post
      - Image.Create.Post
      - Scene.Create.Post
  - name: New tags, performers and studios
    description: When "Capitalise new tags automatically" is on, capitalises a tag's name as soon as it's created. When "Auto tag new performers, studios and tags" is on, runs Stash's Auto Tag for each new one.
    triggeredBy:
      - Tag.Create.Post
      - Performer.Create.Post
      - Studio.Create.Post

tasks:
  - name: Preview top tags (no changes)
    description: Writes what the three "Tag ... with their top tags" tasks below would add and remove for performers, studios and galleries to the log, without changing anything.
    defaultArgs:
      mode: dryrun_all
  - name: Tag performers with their top tags
    description: Counts the tags on every performer's scenes, images and galleries and adds the most used ones to the performer. Tags this plugin added earlier that are no longer in the top list are taken off again; tags you added yourself are never removed.
    defaultArgs:
      mode: apply
  - name: Tag studios with their top tags
    description: The same for studios - counts the tags on each studio's scenes, images and galleries and adds the most used ones to the studio.
    defaultArgs:
      mode: apply_studios
  - name: Tag galleries with their top tags
    description: The same for galleries - counts the tags on each gallery's images and adds the most used ones to the gallery. Gallery-name tags never count.
    defaultArgs:
      mode: apply_galleries
  - name: "AI tagging: preview on 10 items (no changes)"
    description: Shows 10 random scenes/images to the local AI model (Ollama) and writes the tags it (and auto tagging from the file path) would add to the log, without changing anything. Try this first.
    defaultArgs:
      mode: ai_preview
  - name: "AI tagging: items with no tags"
    description: Uses the local AI model (Ollama) to tag scenes and images that have no tags yet, choosing from your most used tags. First adds the performers, studio and tags whose names are in each file's path (like Stash's Auto Tag). Organized items are skipped unless you change that in the settings.
    defaultArgs:
      mode: ai_untagged
  - name: "AI tagging: everything not done yet"
    description: Uses the local AI model (Ollama) on every scene and image it hasn't looked at before, after auto tagging each one from its file path (only ever adds). Can take many hours on a big library; it can be stopped and run again, and carries on where it left off.
    defaultArgs:
      mode: ai_all
  - name: Preview titles from file names (no changes)
    description: Writes the titles "Fill in titles from file names" (below) would give to the log, without changing anything.
    defaultArgs:
      mode: titles_preview
  - name: Fill in titles from file names
    description: Gives scenes, images and galleries without a title one made from the file name, cleaned up - no [ids] or [site names], dates, resolutions or codecs, and no performer or studio name as its own part (unless "Keep performer and studio names in titles" is on). Camera and app names (IMG_1234, screen recordings, FullSizeRender...) and random ids are left without a title. Titles you already have are never changed.
    defaultArgs:
      mode: titles
  - name: Redo titles made from file names
    description: Makes titles that came from file names again with the current settings, e.g. after turning "Keep performer and studio names in titles" on or off. Only titles that exactly match one this plugin makes are changed; titles you typed or scraped are left alone.
    defaultArgs:
      mode: retitles
  - name: "AI titles: preview on 10 items (no changes)"
    description: Picks 10 random scenes/images without a title and writes the title each would get to the log - from the file name when that makes a good one, else from the local AI model (Ollama) - without changing anything. Try this first.
    defaultArgs:
      mode: ai_titles_preview
  - name: "AI titles: scenes without a title"
    description: Gives every scene without a title one - from the file name when that makes a good one, else the local AI model's best idea after looking at a few frames (plus its performers, studio and tags). Titles you already have are never changed. Takes a few seconds per scene; skips organized scenes unless "AI - include organized items" is on.
    defaultArgs:
      mode: ai_titles_scenes
  - name: "AI titles: images without a title"
    description: The same for images (camera photos, screenshots...). Takes a few seconds per image, so a big library can take hours; you can cancel it under Settings → Tasks and run it again later to carry on.
    defaultArgs:
      mode: ai_titles_images
  - name: Preview dates from file names (no changes)
    description: Writes what "Fill in dates from file names" would set to the log, without changing anything.
    defaultArgs:
      mode: dates_preview
  - name: Fill in dates from file names
    description: Gives scenes, images and galleries that have no date the date in their file name (or their folder's name) - "2023-05-19_video", "Studio - 6 Nov 2026 - Title", "Studio.21.07.08.Name", "05-27-2014 17_26_15" and similar. Only full dates count, and dates you've already set are never changed.
    defaultArgs:
      mode: dates
  - name: Give tags without a picture one from your library
    description: Every tag that has no picture gets one from your library - the photo that's most "about" that tag (fewest other tags, then highest rated), else a scene screenshot, a marker screenshot or a gallery cover. Each tag gets a picture no other tag has where possible, if need be a different frame from one of its scenes. Tags that already have a picture are never changed.
    defaultArgs:
      mode: tagpictures
  - name: Give tags that share a picture their own
    description: Finds tags that have the same picture as another tag and gives each its own from your library where possible. In each group the rarest tag keeps the picture. Only tags that share a picture are changed.
    defaultArgs:
      mode: uniquepictures
  - name: Give every tag a new picture (replaces existing ones)
    description: Gives EVERY tag a different picture from the one it has now - including pictures you chose yourself - picked the same way (most "about" the tag, unique where possible, rarest tags first, video frames if need be). Tags with no other picture available keep theirs. Old pictures can't be brought back, so make a backup first.
    defaultArgs:
      mode: newpictures
  - name: Preview tag name capitalisation (no changes)
    description: Writes what "Capitalise tag names" would rename to the log, without changing anything.
    defaultArgs:
      mode: titlecase_preview
  - name: Capitalise tag names
    description: Capitalises every tag name the same way - "dating app" becomes "Dating App", small words like "on", "to" and "and" stay lowercase in the middle ("Behind the Scenes"). Capitals already in a name are never lowered.
    defaultArgs:
      mode: titlecase
  - name: Tag gallery images with the gallery's name
    description: Gives every image in every gallery a tag named after its gallery (its title, or the zip or folder name), creating the tags as needed. Use it once to catch up existing galleries; the setting below keeps new ones tagged.
    defaultArgs:
      mode: gallerynames

settings:
  topTagCount:
    displayName: Top tags per performer, studio or gallery
    description: How many of the most used tags to add to each performer, studio or gallery. Default 10.
    type: NUMBER
  minUses:
    displayName: Minimum uses
    description: A tag must be on at least this many of the performer's (or studio's) scenes, images and galleries, or of a gallery's images, to count. Default 3.
    type: NUMBER
  skipImages:
    displayName: Don't count images
    description: Only count scenes and galleries for performers and studios. Useful if large image sets drown out everything else. (Galleries always count their images.)
    type: BOOLEAN
  excludeTags:
    displayName: Tags to ignore
    description: Comma-separated tag names that should never be added to performers, studios or galleries as top tags (for example housekeeping tags like "Organized, To Review"). This doesn't affect Auto Tag; for that, turn on "Ignore Auto Tag" on the tag itself.
    type: STRING
  noAutoRefresh:
    displayName: Don't refresh on edit
    description: Turn off the automatic refresh of top tags (performers, and studios and galleries if turned on below) when you change tags on scenes, images or galleries. The tasks still work.
    type: BOOLEAN
  studioTopTags:
    displayName: Refresh studios' top tags on edit
    description: When tags or the studio change on a scene, image or gallery, refresh that studio's top tags too (like performers'). Run "Tag studios with their top tags" once to catch up.
    type: BOOLEAN
  galleryTopTags:
    displayName: Refresh galleries' top tags on edit
    description: When an image's tags or galleries change, refresh its galleries' top tags too. Run "Tag galleries with their top tags" once to catch up.
    type: BOOLEAN
  galleryNameTags:
    displayName: Tag gallery images with the gallery's name
    description: Automatically tag images in a gallery with a tag named after the gallery (its title, or the zip or folder name). Runs for new and renamed galleries, newly scanned images and images moved into a gallery. Images added with a gallery's "Add" tab are picked up by the task. These tags never count towards performers' top tags.
    type: BOOLEAN
  galleryTagParent:
    displayName: Parent tag for gallery-name tags
    description: Optional. New gallery-name tags are put under this tag (created if needed), e.g. "Galleries", to keep the tag list tidy.
    type: STRING
  autoTagPictures:
    displayName: Give tags a picture automatically
    description: When a tag that has no picture is added to a scene, image or gallery, give the tag a picture from your library (see the "Give tags without a picture" task). Tags that already have a picture are never changed.
    type: BOOLEAN
  titleCaseNewTags:
    displayName: Capitalise new tags automatically
    description: Capitalise a tag's name (see the "Capitalise tag names" task) as soon as it's created - from the tag picker, a scraper or another plugin.
    type: BOOLEAN
  titleCaseSpellings:
    displayName: Special spellings
    description: Comma-separated words or tag names to always write exactly like this when capitalising, for acronyms and odd capitals - for example "CNN, POV, HD, iPhone". Matched without caring about case.
    type: STRING
  autoTagNew:
    displayName: Auto tag new performers, studios and tags
    description: When a performer, studio or tag is created (by hand, a scraper or another plugin), run Stash's Auto Tag for it, so files with its name in their path get it straight away. Ones set to "Ignore Auto Tag" are skipped.
    type: BOOLEAN
  datesNewItems:
    displayName: Fill in dates of new scenes, images and galleries
    description: When a scan adds a scene, image or gallery, set its date from the file name (see the "Fill in dates from file names" task). "Auto tag this" and AI tagging also fill in empty dates.
    type: BOOLEAN
  titlesNewItems:
    displayName: Fill in titles of new scenes, images and galleries
    description: When a scan adds a scene, image or gallery, give it a title from its file name (see the "Fill in titles from file names" task). "Auto tag this" and AI tagging also fill in empty titles.
    type: BOOLEAN
  titlesKeepNames:
    displayName: Keep performer and studio names in titles
    description: Titles from file names normally leave out performer and studio names (e.g. "Jane Doe - Beach Day" becomes "Beach Day"). Turn this on to keep them. A file named only after a performer still gets no title.
    type: BOOLEAN
  aiAuto:
    displayName: "AI: tag new scenes and images automatically"
    description: Have the local AI model tag scenes and images as they're added by a scan.
    type: BOOLEAN
  aiOllamaUrl:
    displayName: "AI: Ollama address"
    description: Where Ollama runs, as seen from Stash. Default http://host.docker.internal:11434 (Ollama on the same computer as Stash's Docker container); use http://localhost:11434 if Stash isn't in Docker.
    type: STRING
  aiModel:
    displayName: "AI: model"
    description: An Ollama vision model. Default gemma3:4b (install it with "ollama pull gemma3:4b") - about 5 seconds a picture on an Apple M4. Bigger models (e.g. qwen2.5vl:7b) can be more detailed but are much slower.
    type: STRING
  aiTagCount:
    displayName: "AI: tags to choose from"
    description: The model picks only from your most used tags - this many of them. Default 250.
    type: NUMBER
  aiMaxTags:
    displayName: "AI: most tags per item"
    description: The most tags the model adds to one scene or image. Default 6.
    type: NUMBER
  aiNoAutoTag:
    displayName: "AI: don't auto tag from file names first"
    description: Before the AI looks at an item, the plugin normally adds the performers, studio and tags whose names are in its file path (the same matching as Stash's Auto Tag). Turn this on to skip that.
    type: BOOLEAN
  aiIncludeOrganized:
    displayName: "AI: include organized items"
    description: Also AI-tag scenes and images you've marked as organized (they're skipped by default).
    type: BOOLEAN
  maxSuggestions:
    displayName: Suggested tags to show
    description: The most suggestions shown under a tag box while editing. Default 15.
    type: NUMBER
