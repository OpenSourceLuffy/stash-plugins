name: Better Organizing Tools
description: Tags each performer and studio with the tags used most often in their scenes, images and galleries, and each gallery with its images' most used tags, shows one-click "Suggested tags" and "Title ideas" when editing, adds "Bulk tag" buttons on performer and gallery pages, and can tag a studio's items with the studio's tags. Can also tag every image in a gallery with the gallery's name, give tags without a picture one from your library, keep tag names consistently capitalised, auto tag from file names, fill in dates and titles from file names, and give scenes a studio from the account link in their file name. No AI - for that, add Better Organizing AI (works with or without this plugin).
version: "2.4.1"
url: https://github.com/OpenSourceLuffy/stash-plugins/tree/main/plugins/BetterTaggingTools
exec:
  - python
  - "{pluginDir}/better_tagging_tools.py"
interface: raw

ui:
  # (the update check reads the published plugin list and changelogs from GitHub)
  csp:
    connect-src:
      - https://opensourceluffy.github.io
      - https://raw.githubusercontent.com
  javascript:
    - better-tagging-tools.js
    - osl-updates.js
  css:
    - better-tagging-tools.css

hooks:
  - name: Refresh performer top tags on edit
    description: When tags or performers change on a scene, image or gallery, queues that item's performers (and, if turned on, its studio and galleries). A background job refreshes each of them once, a few seconds after the last edit, so batch edits are handled in one go.
    triggeredBy:
      - Scene.Update.Post
      - Image.Update.Post
      - Gallery.Update.Post
  - name: New galleries, scenes and images
    description: "When \"New items: tag gallery images with the gallery's name\" is on, new galleries and newly scanned images get their gallery-name tag; when \"New items: fill in dates from file names\" or \"New items: fill in titles from file names\" is on, they get the date or title from their file name. They're queued and a background job does the work once the scan is done."
    triggeredBy:
      - Gallery.Create.Post
      - Image.Create.Post
      - Scene.Create.Post
  - name: New tags, performers and studios
    description: "When \"Tags: capitalise new tags automatically\" is on, capitalises a tag's name as soon as it's created. When \"New items: auto tag new performers, studios and tags\" is on, runs Stash's Auto Tag for each new one."
    triggeredBy:
      - Tag.Create.Post
      - Performer.Create.Post
      - Studio.Create.Post

tasks:
  # --- Top tags ---
  - name: "Top tags: tag performers with their top tags"
    description: "Adds each performer's most used tags (from their scenes, images and galleries). Tags this plugin added that dropped out are removed; yours never are."
    defaultArgs:
      mode: "apply"
  - name: "Top tags: tag studios with their top tags"
    description: "The same for studios."
    defaultArgs:
      mode: "apply_studios"
  - name: "Top tags: tag galleries with their top tags"
    description: "The same for galleries, from their images. Gallery-name tags never count."
    defaultArgs:
      mode: "apply_galleries"
  - name: "Top tags: tag studios' items with the studio's tags"
    description: "Gives each studio's own scenes, images and galleries the studio's tags. Only adds. A studio page has a button for one studio too."
    defaultArgs:
      mode: "studiotags"
  - name: "Top tags: preview (no changes)"
    description: "Writes what the three top-tags tasks would add and remove to the log. Changes nothing."
    defaultArgs:
      mode: "dryrun_all"
  - name: "Top tags: preview studio tags on their items (no changes)"
    description: "Writes what \"Top tags: tag studios' items with the studio's tags\" would add to the log. Changes nothing."
    defaultArgs:
      mode: "studiotags_preview"
  # --- Titles & dates ---
  - name: "Titles: fill in titles from file names"
    description: "Gives scenes, images and galleries without a title a cleaned-up one from the file name. Camera names (IMG_1234...) get none; existing titles are never changed."
    defaultArgs:
      mode: "titles"
  - name: "Titles: redo titles made from file names"
    description: "Makes file-name titles again with the current settings. Titles you typed or scraped are left alone."
    defaultArgs:
      mode: "retitles"
  - name: "Dates: fill in dates from file names"
    description: "Gives items without a date the full date in their file or folder name (\"2023-05-19\", \"6 Nov 2026\"...). Dates you set are never changed."
    defaultArgs:
      mode: "dates"
  - name: "Titles: preview from file names (no changes)"
    description: "Writes the titles \"Titles: fill in titles from file names\" would give to the log. Changes nothing."
    defaultArgs:
      mode: "titles_preview"
  - name: "Dates: preview from file names (no changes)"
    description: "Writes the dates \"Dates: fill in dates from file names\" would set to the log. Changes nothing."
    defaultArgs:
      mode: "dates_preview"
  # --- Studios ---
  - name: "Studios: find scenes' studios from file names and links"
    description: "Gives scenes without a studio the account in their file name, title or links (e.g. onlyfans.com/name), and the matching performer. Fast, no AI."
    defaultArgs:
      mode: "handle_studios_text"
  # --- Tag pictures ---
  - name: "Tag pictures: give tags without one a picture from your library"
    description: "Gives tags without a picture the photo most \"about\" that tag (else a scene, marker or gallery cover) - never one another tag has."
    defaultArgs:
      mode: "tagpictures"
  - name: "Tag pictures: give tags that share a picture their own"
    description: "Tags that share a picture each get their own where possible; the rarest tag keeps it."
    defaultArgs:
      mode: "uniquepictures"
  - name: "Tag pictures: give every tag a new one (replaces yours)"
    description: "Gives every tag a different picture, replacing ones you chose too. Old pictures can't be brought back - back up first."
    defaultArgs:
      mode: "newpictures"
  # --- Naming & descriptions ---
  - name: "Naming: apply to performers, studios, galleries and titles"
    description: "Renames performers, studios and galleries and capitalises scene and image titles in the styles chosen in the settings (Naming: ...). Kinds left empty are skipped; account names are left alone."
    defaultArgs:
      mode: "naming"
  - name: "Naming: capitalise tag names"
    description: "Capitalises every tag name the same way (\"dating app\" becomes \"Dating App\"; small words stay lowercase). Capitals are never lowered."
    defaultArgs:
      mode: "titlecase"
  - name: "Tag descriptions: fill in empty ones"
    description: "Gives tags without a description one from StashDB, the E-Hentai wiki or Danbooru. Descriptions you wrote are never changed."
    defaultArgs:
      mode: "tagdescs"
  - name: "Naming: preview (no changes)"
    description: "Writes what \"Naming: apply...\" would rename to the log. Changes nothing."
    defaultArgs:
      mode: "naming_preview"
  - name: "Naming: preview tag capitalisation (no changes)"
    description: "Writes what \"Naming: capitalise tag names\" would rename to the log. Changes nothing."
    defaultArgs:
      mode: "titlecase_preview"
  - name: "Tag descriptions: preview on 30 tags (no changes)"
    description: "Writes the descriptions 30 random tags would get, and where from, to the log. Changes nothing."
    defaultArgs:
      mode: "tagdescs_preview"
  # --- Gallery images ---
  - name: "Gallery images: tag them with the gallery's name"
    description: "Tags every gallery image with a tag named after its gallery. Run once to catch up; the setting keeps new ones tagged."
    defaultArgs:
      mode: "gallerynames"
  - name: "Gallery images: add the gallery's tags, performers and studio"
    description: "Gives gallery images the gallery's tags and performers, and its studio if they have none. Only adds."
    defaultArgs:
      mode: "gallerytags"
  - name: "Gallery images: preview the gallery's tags, performers and studio (no changes)"
    description: "Writes what that task would add to the log. Changes nothing."
    defaultArgs:
      mode: "gallerytags_preview"

settings:
  # --- Top tags ---
  topTagCount:
    displayName: "Top tags: how many per performer, studio or gallery"
    description: "How many of their most used tags performers, studios and galleries get. Default 10."
    type: NUMBER
  minUses:
    displayName: "Top tags: minimum uses"
    description: "A tag must be on at least this many of their items to count. Default 3."
    type: NUMBER
  skipImages:
    displayName: "Top tags: don't count images"
    description: "Count only scenes and galleries for performers and studios (when big image sets drown out the rest)."
    type: BOOLEAN
  excludeTags:
    displayName: "Top tags: tags to ignore"
    description: "Comma-separated tags never added as top tags, e.g. Organized, To Review."
    type: STRING
  noAutoRefresh:
    displayName: "Top tags: don't refresh on edit"
    description: "Don't refresh top tags when you change tags on scenes, images or galleries (the tasks still work)."
    type: BOOLEAN
  studioTopTags:
    displayName: "Top tags: refresh studios' on edit"
    description: "Also refresh a studio's top tags when its items change."
    type: BOOLEAN
  galleryTopTags:
    displayName: "Top tags: refresh galleries' on edit"
    description: "Also refresh a gallery's top tags when its images change."
    type: BOOLEAN
  # --- New items ---
  titlesNewItems:
    displayName: "New items: fill in titles from file names"
    description: "Give new scenes, images and galleries a title from the file name as a scan adds them."
    type: BOOLEAN
  datesNewItems:
    displayName: "New items: fill in dates from file names"
    description: "Give new scenes, images and galleries the date in their file name as a scan adds them."
    type: BOOLEAN
  autoTagNew:
    displayName: "New items: auto tag new performers, studios and tags"
    description: "Run Stash's Auto Tag for each new performer, studio or tag, so files named after it get it straight away."
    type: BOOLEAN
  galleryNameTags:
    displayName: "New items: tag gallery images with the gallery's name"
    description: "Tag gallery images with a tag named after the gallery, for new and renamed galleries and new images."
    type: BOOLEAN
  galleryTagParent:
    displayName: "New items: parent tag for gallery-name tags"
    description: "Optional: put new gallery-name tags under this tag (e.g. Galleries)."
    type: STRING
  # --- Titles ---
  titlesKeepNames:
    displayName: "Titles: keep performer and studio names"
    description: "Keep performer and studio names in titles from file names (they're left out by default)."
    type: BOOLEAN
  titlesNoGallery:
    displayName: "Titles: don't title images after their gallery"
    description: "Leave images whose file name makes no title without one, instead of naming them after their gallery (e.g. \"Beach Trip #12\")."
    type: BOOLEAN
  # --- Tags ---
  autoTagPictures:
    displayName: "Tags: give tags a picture automatically"
    description: "When a tag without a picture is used, give it one from your library."
    type: BOOLEAN
  titleCaseNewTags:
    displayName: "Tags: capitalise new tags automatically"
    description: "Capitalise new tags' names as they're created."
    type: BOOLEAN
  titleCaseSpellings:
    displayName: "Naming: special spellings (tags too)"
    description: "Comma-separated words always written exactly like this when capitalising tags and in the naming styles, e.g. CNN, POV, iPhone."
    type: STRING
  namingPerformers:
    displayName: "Naming: performers"
    description: "One of: Title Case, Capitalise Every Word, Sentence case - or empty for off. \"Capitalise Every Word\" keeps particles like de and van as written (Lena de Vries)."
    type: STRING
  namingStudios:
    displayName: "Naming: studios"
    description: "One of: Title Case, Capitalise Every Word, Sentence case - or empty for off. Accounts (studios under OnlyFans, Fansly...) keep their handle."
    type: STRING
  namingGalleries:
    displayName: "Naming: galleries"
    description: "One of: Title Case, Capitalise Every Word, Sentence case - or empty for off."
    type: STRING
  namingTitles:
    displayName: "Naming: scene and image titles"
    description: "One of: Title Case, Capitalise Every Word, Sentence case - or empty for off. Title Case also lowers small words in the middle (Relaxing By The Pool -> Relaxing by the Pool). Titles the plugins set follow it too."
    type: STRING
  namingNew:
    displayName: "Naming: apply to new performers, studios and galleries"
    description: "Rename new ones to their style as soon as they're created."
    type: BOOLEAN
  maxSuggestions:
    displayName: "Tags: suggestions to show when editing"
    description: "The most tag suggestions shown under a tag box while editing. Default 15."
    type: NUMBER
