name: Better Organizing AI Add-on (local AI)
description: Local AI for Stash - nothing leaves your computer. Tags scenes and images from your own tag list (checked against the items you've already tagged that look most alike), writes titles, recognises performers' faces, finds a scene's studio from the account in its watermark, adds body tags and hair / eye colour, and tidies up studios and galleries. A Review page to accept or undo suggestions with a swipe, "Ask AI" buttons while editing, and tasks for the whole library or new items. Runs on Ollama and a small local helper, on a Mac or any ordinary computer, with no NVIDIA graphics card or online service needed. An add-on for Better Organizing Tools that also works on its own.
version: "1.8"
url: https://github.com/OpenSourceLuffy/stash-plugins/tree/main/plugins/BetterTaggingAI
exec:
  - python
  - "{pluginDir}/better_tagging_ai.py"
interface: raw

ui:
  javascript:
    - better-tagging-ai.js
  css:
    - better-tagging-ai.css
  assets:
    /tour: tour

hooks:
  - name: New scenes and images
    description: 'When "New items: tag them (AI model)" or "New items: tag, title and find their studio (AI model)" is on, new scenes and images are queued and a background job does them once the scan is done.'
    triggeredBy:
      - Scene.Create.Post
      - Image.Create.Post
  - name: Marker pictures
    description: A marker made or moved in Stash's own form gets its picture straight away (Stash deletes a marker's picture when its times change, and waits for Generate).
    triggeredBy:
      - SceneMarker.Create.Post
      - SceneMarker.Update.Post

tasks:
  # --- Setup & schedules ---
  - name: "Setup: check everything and write a report"
    description: "Checks Ollama, the face helper, the scans and the settings, and writes what works and how to fix the rest to the log. The setup page (/ai-setup) shows the same with more help."
    defaultArgs:
      mode: "diagnose_log"
  - name: "Schedules: run the nightly jobs now"
    description: "Runs your Every night list now instead of at the night time. Choose its jobs on the Nightly & after-scan jobs page (/ai-nightly)."
    defaultArgs:
      mode: "nightly_jobs"
  - name: "Schedules: run the after-scan jobs now"
    description: "Runs your After a scan list now. It also runs by itself when a scan you start finishes (choose its jobs on /ai-nightly)."
    defaultArgs:
      mode: "after_scan_jobs"
  - name: "Schedules: run tonight's waiting steps for new items now"
    description: "With \"wait until night for new items\" on: does the AI steps saved for tonight (AI tags, watermarks, titles) now."
    defaultArgs:
      mode: "night_run"
  # --- Tags ---
  - name: "Tags: scan scenes and images for look-alikes (do this first)"
    description: "Makes a picture fingerprint of every scene and image, once (under a second each). Look-alike tags, Search and Review need it. Needs the face helper; stop and rerun to carry on."
    defaultArgs:
      mode: "looks_scan"
  - name: "Tags: tag scenes and images with no tags (AI model)"
    description: "The local AI model tags scenes and images that have no tags, choosing from your most used tags (after adding names found in the file path). Only adds."
    defaultArgs:
      mode: "ai_untagged"
  - name: "Tags: tag all scenes and images not done yet (AI model)"
    description: "The same for every scene and image the AI hasn't looked at. Hours on a big library; stop it and run it again to carry on."
    defaultArgs:
      mode: "ai_all"
  - name: "Tags: tag scenes and images with no tags (look-alikes)"
    description: "Gives untagged scenes and images the tags their look-alikes are sure of. Quick, no AI model; only adds."
    defaultArgs:
      mode: "looks_untagged"
  - name: "Tags: add body tags to scenes and images not done yet"
    description: "Adds what's shown (Tits, Ass, Pussy, Cock) and sizes from the performers to items not done yet. Needs the face helper's body model; stop and rerun to carry on."
    defaultArgs:
      mode: "body_all"
  - name: "Tags: add clothing tags from the look (quick)"
    description: "Clothing tags, and Ass for butts sticking out, for every photo from its look-alike fingerprint - minutes for the whole library. Near-misses go to Review."
    defaultArgs:
      mode: "body_looks"
  - name: "Tags: redo body tags on all scenes and images"
    description: "Checks every scene and image again, organized and done ones too - e.g. after making a body tag or adding performers' sizes. Only adds."
    defaultArgs:
      mode: "body_redo"
  - name: "Tags: scan images' body poses for pose suggestions (Mac)"
    description: "On a Mac: reads the body pose in each photo and marker picture, for pose suggestions in Review. Quick; done ones are skipped."
    defaultArgs:
      mode: "pose_scan"
  - name: "Tags: preview on 10 (AI model, no changes)"
    description: "Writes the tags the AI would add to 10 random items to the log. Changes nothing - try this first."
    defaultArgs:
      mode: "ai_preview"
  - name: "Tags: preview on 10 (look-alikes, no changes)"
    description: "Writes the tags look-alikes suggest for 10 untagged items to the log. Changes nothing."
    defaultArgs:
      mode: "looks_preview"
  - name: "Tags: preview body tags on 10 (no changes)"
    description: "Writes the body tags 10 random items would get to the log. Changes nothing."
    defaultArgs:
      mode: "body_preview"
  - name: "Tags: preview clothing tags from the look (no changes)"
    description: "Writes the clothing tags the quick task would add to the log. Changes nothing."
    defaultArgs:
      mode: "body_looks_preview"
  # --- Faces ---
  - name: "Faces: scan scenes and images"
    description: "Finds the faces in every scene and image once, for matching and \"Might also be in\". Stop it and run it again to carry on."
    defaultArgs:
      mode: "faces_scan"
  - name: "Faces: learn performers' faces"
    description: "Learns each performer's face from their profile picture and solo photos. Quick after the first time."
    defaultArgs:
      mode: "faces_learn"
  - name: "Faces: learn more from what you've tagged"
    description: "Learns more of each performer's faces (other angles and lighting) from scenes and photos where they're alone."
    defaultArgs:
      mode: "faces_learn_tagged"
  - name: "Faces: find performers in scenes without any"
    description: "Finds who's in scenes without performers: adds confident matches if \"add confident matches automatically\" is on, else lists them in the log."
    defaultArgs:
      mode: "faces_scenes"
  - name: "Faces: find performers in images without any"
    description: "The same for images."
    defaultArgs:
      mode: "faces_images"
  - name: "Faces: find performers who may be the same person"
    description: "Lists performers whose faces are most alike in the log (one person under two names, or just look-alikes). Changes nothing."
    defaultArgs:
      mode: "faces_duplicates"
  - name: "Faces: preview on 10 (no changes)"
    description: "Writes who the people in 10 random items without performers look like to the log. Changes nothing."
    defaultArgs:
      mode: "faces_preview"
  # --- Markers & positions ---
  - name: "Markers: download the video model (needed first)"
    description: "Downloads Auto Seek's video model (about 100 MB, checked against its SHA-256) into Stash's config folder, so AI markers and positions work without the Auto Seek plugin. Only needed once."
    defaultArgs:
      mode: "video_model_get"
  - name: "Markers: add AI markers to scenes without markers"
    description: "Adds markers where each scene's action starts and shifts, with pictures. Scenes that have markers aren't touched. Needs the video model (the task above); up to a minute per scene."
    defaultArgs:
      mode: "video_markers_all"
  - name: "Markers: redo AI markers with the newest method"
    description: "Replaces existing AI markers with new ones; other markers are kept. Changes you made to AI markers by hand are lost."
    defaultArgs:
      mode: "video_markers_redo"
  - name: "Markers: add their tags to their scenes"
    description: "Gives each scene the tags its markers have and it doesn't (not Scene Shift, excluded tags, or tags you took off the scene). New marker tags go on the scene as you add them; this is for markers tagged before."
    defaultArgs:
      mode: "marker_tags_to_scenes"
  - name: "Markers: scan scenes for positions (for Review)"
    description: "Looks at every scene with the video model and suggests the positions it sees in Review (nothing is tagged). Stop and rerun to carry on."
    defaultArgs:
      mode: "video_scan"
  - name: "Markers: preview AI markers on 5 scenes (no changes)"
    description: "Writes the markers 5 random scenes would get to the log. Changes nothing."
    defaultArgs:
      mode: "video_markers_preview"
  - name: "Markers: preview adding their tags to scenes (no changes)"
    description: "Writes the tags each scene would get from its markers to the log. Changes nothing."
    defaultArgs:
      mode: "marker_tags_to_scenes_preview"
  # --- Titles ---
  - name: "Titles: title scenes without one (AI model)"
    description: "Gives scenes without a title one - from the file name if it makes a good one, else from the AI. Existing titles are never changed."
    defaultArgs:
      mode: "ai_titles_scenes"
  - name: "Titles: title images without one (AI model)"
    description: "The same for images. A few seconds each, so a big library takes hours."
    defaultArgs:
      mode: "ai_titles_images"
  - name: "Titles: preview on 10 (AI model, no changes)"
    description: "Writes the titles 10 random items would get to the log. Changes nothing."
    defaultArgs:
      mode: "ai_titles_preview"
  # --- Studios & links ---
  - name: "Studios: find scenes' studios from accounts and watermarks"
    description: "Gives scenes without a studio the account they come from (OnlyFans, Fansly, Instagram...) - from links, and the watermark the AI reads. Adds matching performers. 5-15 s per scene."
    defaultArgs:
      mode: "handle_studios"
  - name: "Studios: find images' studios from watermarks (not in galleries)"
    description: "Gives photos without a studio, outside galleries, the studio whose watermark the AI reads, and matching performers. A few seconds per photo."
    defaultArgs:
      mode: "photo_studios"
  - name: "Studios: find images' studios from watermarks (galleries too)"
    description: "The same, including photos in galleries (these rarely have a watermark, so it mostly adds time)."
    defaultArgs:
      mode: "photo_studios_all"
  - name: "Links: add account and written links to scenes and images"
    description: "Puts the account links in each item's file name, title, description or links (OnlyFans, Fansly, Patreon, Instagram, TikTok profiles) and web links written in its title or description in its URLs. No AI, quick. The studios tasks add the accounts they read in watermarks too."
    defaultArgs:
      mode: "item_links"
  - name: "Studios: preview on 10 scenes (no changes)"
    description: "Writes the account and studio 10 random scenes without a studio would get to the log. Changes nothing."
    defaultArgs:
      mode: "handle_studios_preview"
  - name: "Studios: preview on 10 images (no changes)"
    description: "Writes the studio the AI reads in 10 random photos' watermarks to the log. Changes nothing."
    defaultArgs:
      mode: "photo_studios_preview"
  - name: "Links: preview (no changes)"
    description: "Writes the links each scene and photo would get to the log. Changes nothing."
    defaultArgs:
      mode: "item_links_preview"
  # --- Pictures ---
  - name: "Tag pictures: pick the most typical for tags without one"
    description: "Gives tags without a picture the scene or photo that looks most like the rest of that tag - never one another tag has."
    defaultArgs:
      mode: "typical_missing"
  - name: "Tag pictures: pick the most typical for every tag (replaces yours)"
    description: "The same for every tag, replacing pictures you chose too. Old pictures can't be brought back - back up first."
    defaultArgs:
      mode: "typical_all"
  - name: "Tag pictures: replace blurry or dark ones (Mac)"
    description: "On a Mac: swaps tag pictures Apple scores low (blurry, dark, screenshots) for clearly better ones."
    defaultArgs:
      mode: "better_tag_pictures"
  - name: "Marker pictures: replace blurry, dark or empty ones (Mac)"
    description: "On a Mac: swaps marker pictures that are blurry, dark or show nobody for a better frame from the marker."
    defaultArgs:
      mode: "better_marker_pictures"
  - name: "Image scores: add aesthetic scores and labels (Mac)"
    description: "On a Mac: gives every photo a 0-100 aesthetic score and what's in it (beach, bedroom...) as custom fields you can filter by. New photos get them by themselves."
    defaultArgs:
      mode: "picture_facts"
  - name: "Tag pictures: preview the most typical (no changes)"
    description: "Writes the picture each tag would get to the log. Changes nothing."
    defaultArgs:
      mode: "typical_preview"
  - name: "Tag & marker pictures: preview replacing blurry ones (Mac, no changes)"
    description: "Writes which tag and marker pictures would be replaced, and how much better, to the log. Changes nothing."
    defaultArgs:
      mode: "better_pictures_preview"
  # --- Scene covers ---
  - name: "Scene covers: replace low-scoring ones (Mac)"
    description: "On a Mac: a cover Stash made that Apple scores low (blurry, dark, nobody in it) is swapped for the best of 9 frames from the video, if clearly better. Scraped, picked and organized covers are left alone (see the settings). Originals are kept."
    defaultArgs:
      mode: "better_covers"
  - name: "Scene covers: put back the originals"
    description: "Puts back every scene cover the task above replaced."
    defaultArgs:
      mode: "restore_covers"
  - name: "Scene covers: preview on 10 (Mac, no changes)"
    description: "Writes each of 10 random scenes' cover score, and the better frame it would get, to the log. Changes nothing."
    defaultArgs:
      mode: "better_covers_preview"
  # --- Screenshots ---
  - name: "Screenshots: crop to the photo"
    description: "Cuts phone screenshots of posts (Instagram, OnlyFans, Reddit...) down to the photo in them. Originals are kept in screenshot-originals."
    defaultArgs:
      mode: "screenshot_crop"
  - name: "Screenshots: put back the originals"
    description: "Puts back every screenshot the crop task cut down."
    defaultArgs:
      mode: "screenshot_restore"
  - name: "Screenshots: preview cropping (no changes)"
    description: "Lists the screenshots that would be cropped, and to what. Changes nothing."
    defaultArgs:
      mode: "screenshot_crop_preview"
  # --- Performer details ---
  - name: "Performer details: fill in empty hair and eye colour"
    description: "The AI fills in empty hair and eye colours from performers' pictures, where two looks at them agree."
    defaultArgs:
      mode: "perf_details"
  - name: "Performer details: preview on 10 (no changes)"
    description: "Writes what the AI sees for 10 performers to the log. Changes nothing."
    defaultArgs:
      mode: "perf_details_preview"

settings:
  # --- Setup ---
  aiOllamaUrl:
    displayName: "Setup: Ollama address"
    description: "Where Ollama runs. Empty: found by itself (host.docker.internal:11434 with Stash in Docker, else 127.0.0.1:11434)."
    type: STRING
  aiModel:
    displayName: "Setup: AI model (in Ollama)"
    description: "An Ollama vision model. Default gemma3:4b (about 5 s a picture on an Apple M4); bigger ones are slower."
    type: STRING
  faceHelperUrl:
    displayName: "Setup: face helper address"
    description: "Where the face helper runs. Empty: found by itself (host.docker.internal:11535 with Stash in Docker, else 127.0.0.1:11535)."
    type: STRING
  welcomeOff:
    displayName: "Setup: hide the welcome and tour"
    description: "Hide the welcome and tour. The tour is also on the setup page."
    type: BOOLEAN
  # --- New items ---
  aiAuto:
    displayName: "New items: tag them (AI model)"
    description: "The AI model tags scenes and images as a scan adds them."
    type: BOOLEAN
  aiNewAll:
    displayName: "New items: tag, title and find their studio (AI model)"
    description: "As a scan adds items, the AI also gives them a title and finds a scene's studio from the accounts and watermarks it shows."
    type: BOOLEAN
  aiNewPhotoStudios:
    displayName: "New items: read watermarks on new images (AI model)"
    description: "As a scan adds photos without a studio, the AI reads their watermark for the studio and performers."
    type: BOOLEAN
  faceAutoAssign:
    displayName: "New items: add confident face matches"
    description: "New items, and the Faces tasks, get the performers they're confident about. Off: suggestions only."
    type: BOOLEAN
  aiNightly:
    displayName: "New items: wait until night for the AI model steps"
    description: "After a scan, do only the quick steps (about a second each) and save the AI model's steps for the night, so scans finish quickly."
    type: BOOLEAN
  # --- Tags & titles ---
  aiTagKinds:
    displayName: "Tags: scenes, images or both (AI model)"
    description: "Scenes, images, or both (empty) - for the AI tagging tasks, new items and the nightly run."
    type: STRING
  aiTitleKinds:
    displayName: "Titles: scenes, images or both (AI model)"
    description: "Which new items get an AI title: scenes, images, or both (empty)."
    type: STRING
  aiTagCount:
    displayName: "Tags: how many of your tags the AI model chooses from"
    description: "The AI picks from this many of your most used tags. Default 250."
    type: NUMBER
  aiMaxTags:
    displayName: "Tags: most tags the AI model adds to one item"
    description: "The most tags the AI adds to one item. Default 6."
    type: NUMBER
  aiSkipTagged:
    displayName: "Tags: skip items with more tags than (AI model)"
    description: "Items with more tags than this skip the AI (body tags still run). Default 5; 0 never skips."
    type: NUMBER
  aiIncludeOrganized:
    displayName: "Tags: include organized scenes and images"
    description: "Also AI-tag items marked as organized (skipped by default)."
    type: BOOLEAN
  aiNoAutoTag:
    displayName: "Tags: don't auto tag from file names first"
    description: "Don't first add the performers, studio and tags named in the file path."
    type: BOOLEAN
  aiLookSuggest:
    displayName: "Tags: look-alike suggestions from (%)"
    description: "On the edit page, show a look-alike tag when at least this share of the most alike items have it. Default 20 (tasks only add at 50 or more)."
    type: NUMBER
  tagSynonyms:
    displayName: "Tags: synonyms"
    description: "Words that mean the same, for Review \u2192 Tags \u2192 Similar. Separate with ; - \"Oral = Blowjob\" (the same), \"Blowjob < Oral\" (under it). Common ones are built in."
    type: STRING
  # --- Faces ---
  faceAutoMin:
    displayName: "Faces: likeness needed to add automatically (%)"
    description: "How alike a face must be to be added without asking. Default 50; higher is stricter."
    type: NUMBER
  faceSuggestMin:
    displayName: "Faces: likeness needed to suggest (%)"
    description: "How alike a face must be to be suggested. Default 36."
    type: NUMBER
  # --- Markers & poses ---
  aiMarkerTag:
    displayName: "Markers: tag for AI markers"
    description: "The tag AI markers get. Default Scene Shift (made if you don't have it)."
    type: STRING
  markerTagsStayOnMarker:
    displayName: "Markers: don't add a marker's tags to its scene"
    description: "Off: a tag you give a marker that its scene doesn't have is added to the scene too."
    type: BOOLEAN
  poseTags:
    displayName: "Poses: pose tags to suggest"
    description: "Pose tags to suggest, comma-separated - only ones you have, with 3 or more photos each. Default: Face Down Ass Up, All Fours, Frog Pose, Kneeling, Squatting, Spread Legs, Legs Up, Bent Over, Lying on Stomach."
    type: STRING
  # --- Scene covers ---
  coverReplaceScraped:
    displayName: "Scene covers: also replace scraped or uploaded covers"
    description: "Off: the covers task leaves covers from Identify, a scraper or an upload alone (scenes linked to StashDB / ThePornDB, or a cover that isn't a frame of the video)."
    type: BOOLEAN
  coverReplacePicked:
    displayName: "Scene covers: also replace covers you picked from the video"
    description: "Off: a cover you chose in Stash's player (a frame of the video other than Stash's own) is left alone."
    type: BOOLEAN
  coverReplaceOrganized:
    displayName: "Scene covers: also replace organized scenes' covers"
    description: "Off: scenes marked organized keep their cover."
    type: BOOLEAN
  # --- Schedules (set on the jobs page) ---
  aiNightTime:
    displayName: "Schedules: night time"
    description: "Set on the Nightly & after-scan jobs page (/ai-nightly). HH:MM, default 03:00."
    type: STRING
  aiTimeZone:
    displayName: "Schedules: time zone"
    description: "Set on the Nightly & after-scan jobs page (/ai-nightly). E.g. America/New_York."
    type: STRING
  nightJobs:
    displayName: "Schedules: nightly jobs (set on the jobs page)"
    description: "Set on the Nightly & after-scan jobs page (/ai-nightly)."
    type: STRING
  afterScanJobs:
    displayName: "Schedules: after-scan jobs (set on the jobs page)"
    description: "Set on the Nightly & after-scan jobs page (/ai-nightly)."
    type: STRING
